<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫美烟台理工学院轮播动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 60px 20px;
        }
        h1 {
            text-align: center;
            color: #c8102e;
            margin-bottom: 70px;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .carousel-section {
            width: 800px;
            margin: 0 auto 80px;
        }
        .section-title {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #c8102e;
            display: inline-block;
            margin-left: 50%;
            transform: translateX(-50%);
        }
        .carousel-wrap {
            width: 100%;
            height: 350px;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .img-list {
            height: 100%;
            display: flex;
        }
        .img-list img {
            width: 800px;
            height: 350px;
            object-fit: cover;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <h1>炫美烟台理工学院</h1>

    <div class="carousel-section">
        <div class="section-title">主题一：校园风景</div>
        <div class="carousel-wrap">
            <div class="img-list" id="list1">
                <img src="图片1.jpg">
                <img src="图片2.jpg">
                <img src="图片3.jpg">
                <img src="图片4.jpg">
                <img src="图片5.jpg">
            </div>
        </div>
    </div>

    <div class="carousel-section">
        <div class="section-title">主题二：人工湖景</div>
        <div class="carousel-wrap">
            <div class="img-list" id="list2">
                <img src="图片6.jpg">
                <img src="图片7.jpg">
                <img src="图片8.jpg">
                <img src="图片9.jpg">
                <img src="图片10.jpg">
            </div>
        </div>
    </div>

    <div class="carousel-section">
        <div class="section-title">主题三：教学楼建筑</div>
        <div class="carousel-wrap">
            <div class="img-list" id="list3">
                <img src="图片11.jpg">
                <img src="图片12.jpg">
                <img src="图片13.jpg">
                <img src="图片14.jpg">
                <img src="图片15.jpg">
            </div>
        </div>
    </div>
    <script src="Lab10-126.js1"></script>
</body>
</html>
